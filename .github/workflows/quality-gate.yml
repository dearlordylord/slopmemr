name: Full quality gate

on:
  workflow_dispatch:
    inputs:
      unii_ref:
        description: Exact UNII commit to validate with this source
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: slopmem
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: slopmem
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dearlordylord/unii
          ref: ${{ inputs.unii_ref }}
          path: unii
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - name: Install pinned tools
        run: |
          set -euo pipefail
          npm install --global pnpm@10.27.0 @openai/codex@0.163.0
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/slopmemr-tools"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/slopmemr-tools" gitleaks
          echo "$RUNNER_TEMP/slopmemr-tools" >> "$GITHUB_PATH"
      - name: Build the selected UNII dependency
        run: |
          npm ci --ignore-scripts --prefix ../unii
          npm run build --prefix ../unii
          git -C ../unii rev-parse HEAD
      - name: Install the exact dependency cohort
        run: pnpm install --frozen-lockfile
      - name: Run every quality and installed artifact gate
        run: |
          set -o pipefail
          pnpm check-all 2>&1 | tee "$RUNNER_TEMP/slopmemr-check-all.log"
      - name: Retain logs and artifact evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-gate-linux-x64
          path: |
            ${{ runner.temp }}/slopmemr-check-all.log
            slopmem/docs/validation/package-memory-reading.json
            slopmem/docs/validation/package-memory-reading-runs.jsonl
            slopmem/docs/validation/npm-package.json
