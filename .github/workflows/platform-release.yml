name: Validate and publish v0.1.2 platforms

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native platform selection
        type: choice
        options: [all, intel]
        default: all

permissions:
  contents: read

concurrency:
  group: platform-release-v0.1.2
  cancel-in-progress: false

jobs:
  package:
    name: Package and witness ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'intel' && '[{"runner":"macos-15-intel","platform":"darwin","arch":"x64"}]' || '[{"runner":"ubuntu-24.04","platform":"linux","arch":"x64"},{"runner":"macos-15","platform":"darwin","arch":"arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"x64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v0.1.2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          architecture: ${{ matrix.arch }}
      - name: Recover the exact validated portable bundles
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p process.platform)" = '${{ matrix.platform }}'
          test "$(node -p process.arch)" = '${{ matrix.arch }}'
          rm -f docs/validation/package-memory-reading.json docs/validation/package-memory-reading-runs.jsonl
          mkdir -p seed dist/bin
          gh release download v0.1.2 --pattern slopmemr-0.1.2-linux-arm64.tar.gz --dir seed
          echo '138c6fe59a110af1b66cdace535cf74e6404d5084db4a4bfaba6b3a403c8ca0c  seed/slopmemr-0.1.2-linux-arm64.tar.gz' | shasum -a 256 -c -
          tar -xzf seed/slopmemr-0.1.2-linux-arm64.tar.gz -C seed
          cp seed/slopmemr-0.1.2-linux-arm64/bin/slopmemr.mjs dist/bin/
          cp seed/slopmemr-0.1.2-linux-arm64/bin/slopmemr-hook.mjs dist/bin/
          cp seed/slopmemr-0.1.2-linux-arm64/bin/THIRD_PARTY_NOTICES.txt dist/bin/
      - name: Package the native embedded runtime
        run: node scripts/package.mjs
      - name: Install the native Codex CLI for its hooks feature command
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-audit --no-fund @openai/codex@0.162.1
          echo "$RUNNER_TEMP/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Exercise installed lifecycle
        run: node scripts/installed-witness.mjs
      - name: Exercise native package, hook timing, MCP, update and removal
        continue-on-error: true
        run: node scripts/package-witness.mjs
      - name: Require functional acceptance and classify Intel latency explicitly
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'docs/validation/package-memory-reading.json'
          const evidence = JSON.parse(readFileSync(path, 'utf8'))
          const flags = ['mcpCliParity', 'eofResidentSurvival', 'liveUpdate', 'sourcePackageRemoval', 'memoryPreserved']
          for (const flag of flags) assert.equal(evidence[flag], true, flag)
          assert.equal(evidence.platform, process.platform)
          assert.equal(evidence.arch, process.arch)
          if (!evidence.complete) {
            assert.equal(process.platform, 'darwin')
            assert.equal(process.arch, 'x64')
            assert.match(evidence.failure, /^Warm hook p95 [0-9.]+ms$/)
            assert.ok(evidence.hook.coldP95Ms <= 2000)
            for (const [stage, count] of [['cold', 10], ['warm', 30]]) {
              assert.equal(evidence.hook[stage].length, count)
              assert.ok(evidence.hook[stage].every(sample => sample.acknowledged && sample.exit === 0))
            }
            assert.equal(evidence.hook.unavailable.length, 3)
            assert.ok(evidence.hook.unavailable.every(sample => !sample.acknowledged && sample.exit !== 0 && sample.elapsedMs <= 3000))
          }
          evidence.releaseClassification = evidence.complete ? 'validated' : 'experimental-latency'
          writeFileSync(path, JSON.stringify(evidence, null, 2) + '\n')
          console.log(JSON.stringify({ releaseClassification: evidence.releaseClassification, strictWitnessPassed: evidence.complete }))
          JS
      - name: Retain witness evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            docs/validation/package-memory-reading.json
            docs/validation/package-memory-reading-runs.jsonl
          retention-days: 30
      - name: Stage validated release files
        run: |
          mkdir -p release-assets
          cp dist/releases/*.tar.gz dist/releases/*.sha256 release-assets/
          cp docs/validation/package-memory-reading.json release-assets/slopmemr-0.1.2-${{ matrix.platform }}-${{ matrix.arch }}.validation.json
      - name: Retain validated packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish accepted packages with explicit latency classification
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Upload native packages and validation evidence
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c ./*.sha256
          gh release upload v0.1.2 ./*
