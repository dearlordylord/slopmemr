[extend]
useDefault = true

[[allowlists]]
description = "Dependency trees and generated build/coverage artifacts are scanned through their source inputs"
paths = ['''(^|/)node_modules/''', '''(^|/)dist/''', '''(^|/)coverage/''', '''pnpm-lock\.yaml$''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public persistent project identity, restricted to its exact file and generated format"
condition = "AND"
paths = ['''(^|/)\.slopmemr-id$''']
regexTarget = "line"
regexes = ['''^\{"version":1,"key":"[0-9a-f]{64}"\}$''']
